let jobs=[],events=[],deviations=[],page='dashboard',selectedDepartment='',enteredTag='',receiveResult=null,receiveStage=1,locationFilter='B-02',locationFocus='',jobsQuery='';
function initialize(){jobs=structuredClone(initialJobs);events=[{time:'09:42',msg:'WO-45777 stored in B-02-06',kind:'ok'},{time:'09:30',msg:'WO-46052 stored in A-03-07',kind:'ok'},{time:'09:18',msg:'WO-45901 awaiting previous work stage',kind:'bad'},{time:'09:04',msg:'WO-46001 stored in C-01-04',kind:'ok'}];deviations=[{time:'09:18',job:'WO-45901',dept:'B-02',issue:'Previous step incomplete · documentation missing'}];selectedDepartment='';enteredTag='';receiveResult=null;receiveStage=1;locationFocus='';}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function time(){return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function spots(dept){const d=DEPTS.find(x=>x.code===dept);if(!d)return[];return Array.from({length:d.capacity},(_,i)=>dept+'-'+String(i+1).padStart(2,'0'))}
function occupied(loc){return jobs.find(x=>x.location===loc);}
function freeSpot(dept){const available=spots(dept).filter(s=>!occupied(s));if(!available.length)return'';const ideal=dept==='B-02'?'B-02-14':null;return available.includes(ideal)?ideal:available[0]}
function freeCount(){return DEPTS.reduce((s,x)=>s+x.capacity,0)-jobs.filter(x=>x.location).length}
function numStored(){return jobs.filter(x=>x.location).length}
function iconArrow(){return '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>'}
function header(eyebrow,title,desc,extra=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><div class="page-sub">${desc}</div></div>${extra}</div>`}
function statusTag(j){let kind=j.status==='In storage'?'green':j.status==='Blocked'?'red':'amber';return `<span class="tag ${kind}"><i></i>${escapeHtml(j.status)}</span>`}
function panelTitle(t,sub='',more=''){return `<div class="panel-head"><div><div class="panel-title">${t}</div>${sub?`<div class="panel-sub">${sub}</div>`:''}</div>${more}</div>`}
function dashboard(){const stored=numStored(),all=DEPTS.reduce((n,d)=>n+d.capacity,0),waiting=jobs.filter(x=>!x.location).length,cap=Math.round(stored/all*100);
return `${header('Operations overview','Production at a glance','An example of the visibility a workshop could have with digital shelf tracking.',`<button class="btn btn-primary" data-goto="receive">Receive an item ${iconArrow()}</button>`)}
<div class="hero"><div><div class="hero-label">WORKSHOP FLOW · CONCEPT</div><h2>Every item. A known location.<br>Every handover. A clear status.</h2><p>Track parts and tools between departments without relying on floor-level visual control.</p></div><button class="btn" data-goto="receive">Start demo receiving ${iconArrow()}</button></div>
<div class="stats"><div class="panel stat"><div class="kpi-label"><i class="kpi-dot"></i> Items in storage</div><div class="kpi-value">${stored}</div><div class="kpi-foot">Across ${DEPTS.length} departments</div></div><div class="panel stat positive"><div class="kpi-label"><i class="kpi-dot"></i> Available locations</div><div class="kpi-value">${freeCount()}</div><div class="kpi-foot">Of ${all} registered locations</div></div><div class="panel stat"><div class="kpi-label"><i class="kpi-dot"></i> Awaiting receipt</div><div class="kpi-value">${waiting}</div><div class="kpi-foot">Including items requiring correction</div></div><div class="panel stat alert"><div class="kpi-label"><i class="kpi-dot"></i> Logged deviations</div><div class="kpi-value">${deviations.length}</div><div class="kpi-foot">Simulated process exceptions</div></div></div>
<div class="grid-two"><section class="panel">${panelTitle('Incoming work','Sample work orders pending transfer',`<button class="inline-link" data-goto="workorders">All work orders →</button>`)}<div class="table-wrap"><table class="tbl"><thead><tr><th>Work order</th><th>Item</th><th>Department</th><th>Status</th></tr></thead><tbody>${jobs.filter(j=>!j.location).slice(0,6).map(j=>`<tr><td class="weight">${escapeHtml(j.id)}</td><td>${escapeHtml(j.part)}</td><td>${escapeHtml(j.department)}</td><td>${statusTag(j)}</td></tr>`).join('')||'<tr><td colspan="4">No pending items.</td></tr>'}</tbody></table></div></section>
<section class="panel">${panelTitle('Department storage occupancy','Items currently assigned to shelf locations',`<span class="tag blue">${cap}% of total</span>`)}<div class="panel-body">${DEPTS.map(d=>{const n=jobs.filter(j=>j.location.startsWith(d.code+'-')).length;return `<div class="bar-row"><div class="bar-name">${d.name}</div><div class="track"><div class="fill" style="width:${n/d.capacity*100}%"></div></div><div class="bar-val">${n}/${d.capacity}</div></div>`}).join('')}<div class="note-box mt20"><strong>Illustrative figures only.</strong><br>This screen is not connected to any production system.</div></div></section></div>
<div class="grid-two mt20"><section class="panel">${panelTitle('Recent activity','Recorded actions in the demonstration')}<div class="panel-body activity">${events.slice(0,5).map(e=>`<div class="activity-item"><span class="activity-symbol ${e.kind==='bad'?'error':''}">${e.kind==='bad'?'!':'✓'}</span><div>${escapeHtml(e.msg)}<span class="activity-time">${escapeHtml(e.time)} · simulated event</span></div></div>`).join('')}</div></section><section class="panel">${panelTitle('Concept walkthrough','Explore the complete process using simulated records')}<div class="panel-body"><div class="card-soft"><div class="panel-title">Try these three scenarios</div><p class="muted micro">1. Scan B-02 and WO-45892 to receive a ready item.<br>2. Scan WO-45901 to see a rejected transfer.<br>3. Open Shelf locations to find the allocated item.</p><button class="btn btn-primary mt12" data-goto="receive">Open receiving interface ${iconArrow()}</button></div><div class="note-box mt12">No live integration, no external services, and no real company data.</div></div></section></div>`}
function receiving(){const step=receiveStage;return `${header('Inbound logistics','Receive an item','Identify the receiving department and the arriving work order. The application checks the work status and allocates a location.')}
<div class="flow-banner"><strong>Demo principle:</strong> Scan the department first, then the part or tool tag. The application chooses the storage location — not the operator.</div>
<div class="steps">${['Identify department','Identify item','Check & allocate','Confirm storage'].map((n,i)=>`<div class="step ${i+1<step?'done':i+1===step?'active':''}"><div class="step-no">${i+1<step?'✓':i+1}</div><div class="step-label">${n}</div></div>`).join('')}</div>
<div class="receive-layout"><section class="panel">${panelTitle('Scan item into a department','Use the sample codes below to simulate barcode / QR scanning')}<div class="panel-body">
<div class="label"><span class="section-num">1</span> &nbsp; Scan department identifier</div><div class="scan-wrap"><input id="deptInput" class="scan-input" placeholder="e.g. B-02" autocomplete="off" value="${escapeHtml(selectedDepartment)}" aria-label="Department code"><button class="btn btn-primary" id="deptScan">Identify</button></div><div class="hint">Select a sample department or enter its code.</div>
<div class="department-list">${DEPTS.map(d=>`<button class="dept ${selectedDepartment===d.code?'selected':''}" data-dept="${d.code}"><span class="dept-code">${d.code}</span><span class="dept-name">${d.name}</span></button>`).join('')}</div><div class="divider"></div>
<div class="label"><span class="section-num">2</span> &nbsp; Scan the part or tool identifier</div><div class="scan-wrap"><input id="tagInput" class="scan-input" placeholder="e.g. WO-45892" autocomplete="off" value="${escapeHtml(enteredTag)}" aria-label="Part tag or work order code"><button class="btn btn-primary" id="tagScan">Check</button></div><div class="hint">The tag identifies the incoming work or tool.</div>
<div class="sample-title">Try a simulated tag</div><div class="samples"><button class="sample" data-tag="WO-45892">WO-45892<small>Ready to receive · B-02</small></button><button class="sample" data-tag="WO-45901">WO-45901<small>Missing previous steps · B-02</small></button><button class="sample" data-tag="WO-46110">WO-46110<small>Different department · A-03</small></button><button class="sample" data-tag="TOOL-JIG-081">TOOL-JIG-081<small>Tool · B-02</small></button></div>
<div class="actions mt20"><button class="btn btn-secondary" id="clearReceive">Clear this receipt</button></div></div></section>
<section class="panel">${panelTitle('Receiving decision','Result of the simulated work order validation')}<div id="resultPanel">${resultHtml()}</div></section></div>`}
function resultHtml(){if(!receiveResult){return `<div class="readout-empty"><svg width="65" height="65" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="11" y="9" width="42" height="46" rx="5"/><path d="M20 19h24M20 27h16M20 37h7m9 0h9M20 45h25"/></svg><h3>Ready for item identification</h3><p>Select a department and scan a sample work order. The result will appear here.</p></div>`}
const r=receiveResult,j=r.job; if(!r.ok){return `<div class="readout"><div class="outcome-head"><div class="outcome-icon bad">✕</div><div><h3>Receipt not permitted</h3><p>Correct the issues before accepting this item.</p></div></div>${j?details(j):''}<div class="callout-danger"><strong>Validation failed</strong><div class="checks">${r.reasons.map(x=>`<div class="check fail"><span class="dot">!</span>${escapeHtml(x)}</div>`).join('')}</div></div><p class="micro muted">No location has been assigned. The existing work order must be corrected in the production management system.</p><div class="actions"><button class="btn btn-secondary" id="retryReceive">Try another item</button></div></div>`}
return `<div class="readout"><div class="outcome-head"><div class="outcome-icon ok">✓</div><div><h3>${r.confirmed?'Item stored successfully':'Work can be received'}</h3><p>${r.confirmed?'The demo location register has been updated.':'Previous work steps are complete.'}</p></div></div>${details(j)}<div class="checks"><div class="check"><span class="dot">✓</span> Work order / asset identified</div><div class="check"><span class="dot">✓</span> Receiving department confirmed</div><div class="check"><span class="dot">✓</span> ${j.type==='Tool'?'Tool can be allocated':'Previous mandatory stages completed'}</div></div><div class="assigned"><div class="smallcaps">${r.confirmed?'STORED IN LOCATION':'ASSIGNED SHELF LOCATION'}</div><div class="code">${escapeHtml(r.loc)}</div><div class="micro" style="color:#3d8667">${r.confirmed?'Receipt completed':'Free and ready for placement'}</div></div>${r.confirmed?`<div class="success-final">✓ Demo event recorded — location and work order now visible in the overview.</div><div class="actions"><button class="btn btn-primary" id="nextReceive">Receive another item ${iconArrow()}</button><button class="btn btn-secondary" data-openloc="${escapeHtml(r.loc)}">View shelf location</button></div>`:`<div class="actions"><button class="btn btn-green" id="confirmReceive">Confirm placement in ${escapeHtml(r.loc)}</button><button class="btn btn-secondary" id="retryReceive">Cancel</button></div>`}</div>`}
function details(j){return `<div class="detail-list"><div class="detail-pair"><span>Identifier</span><strong>${escapeHtml(j.id)}</strong></div><div class="detail-pair"><span>${j.type==='Tool'?'Tool':'Part'}</span><strong>${escapeHtml(j.part)}</strong></div><div class="detail-pair"><span>Serial / asset</span><strong>${escapeHtml(j.sn)}</strong></div><div class="detail-pair"><span>Receiving department</span><strong>${escapeHtml(j.department)} · ${escapeHtml(DEPTS.find(d=>d.code===j.department)?.name)}</strong></div></div>`}
function locations(){let dep=DEPTS.find(d=>d.code===locationFilter)||DEPTS[0];let list=spots(dep.code);return `${header('Storage register','Shelf locations','Each shelf position has a unique ID. The application maintains its own record of stored parts and tools.')}
<div class="panel">${panelTitle('Location map',`Select a department to view its registered ${dep.capacity} locations.`,`<select class="filter-select" id="locationSelect" aria-label="Choose department">${DEPTS.map(d=>`<option value="${d.code}" ${dep.code===d.code?'selected':''}>${d.code} · ${d.name}</option>`).join('')}</select>`)}<div class="location-grid">${list.map(loc=>{const j=occupied(loc);return `<button class="location ${j?'occupied':''} ${locationFocus===loc?'highlight':''}" data-location="${loc}"><div><div class="location-code">${loc}</div><div class="loc-sub">${j?escapeHtml(j.part):'No item assigned'}</div></div><div class="loc-state">${j?`● Occupied · ${escapeHtml(j.id)}`:'○ Available'}</div></button>`}).join('')}</div><div class="result-footer">Click any location for its details. Occupancy changes when you confirm a receiving operation.</div></div><div id="locationDetail" class="panel mt20">${locationDetail()}</div>`}
function locationDetail(){const loc=locationFocus&&spots(locationFilter).includes(locationFocus)?locationFocus:spots(locationFilter)[0];const j=occupied(loc);return `${panelTitle(`Location ${escapeHtml(loc)}`,'Example of the information shown for an individual shelf position')}<div class="panel-body"><div class="info-grid"><div class="info-tile"><span>Status</span><strong>${j?'Occupied':'Available'}</strong></div><div class="info-tile"><span>Assigned work order / asset</span><strong style="font-size:15px">${j?escapeHtml(j.id):'—'}</strong></div><div class="info-tile"><span>Part / tool</span><strong style="font-size:13px">${j?escapeHtml(j.part):'—'}</strong></div><div class="info-tile"><span>Serial number</span><strong style="font-size:15px">${j?escapeHtml(j.sn):'—'}</strong></div></div></div>`}
function workorders(){const filtered=jobs.filter(j=>[j.id,j.part,j.department,j.location,j.sn].some(v=>v.toLowerCase().includes(jobsQuery.toLowerCase())));return `${header('Traceability','Work orders & tools','Search the simulated data to find an item, its workflow status, and its latest registered shelf location.')}
<section class="panel">${panelTitle('Work order register',`${jobs.length} simulated item records`,`<input class="search" id="jobsSearch" placeholder="Search work order, part..." aria-label="Search work orders" value="${escapeHtml(jobsQuery)}">`)}<div class="table-wrap" id="jobRows">${jobTable(filtered)}</div><div class="result-footer">This is sample information only; not connected to an ERP or MRO system.</div></section>`}
function jobTable(list){return `<table class="tbl"><thead><tr><th>Work order / asset</th><th>Part / tool</th><th>Current stage</th><th>Department</th><th>Location</th><th>Status</th></tr></thead><tbody>${list.length?list.map(j=>`<tr><td class="weight">${escapeHtml(j.id)}</td><td>${escapeHtml(j.part)}</td><td>${escapeHtml(j.stage)}</td><td>${escapeHtml(j.department)}</td><td class="weight">${escapeHtml(j.location||'—')}</td><td>${statusTag(j)}</td></tr>`).join(''):'<tr><td colspan="6">No matching work orders.</td></tr>'}</tbody></table>`}
function exceptions(){return `${header('Quality of handovers','Process deviations','Invalid transfers are rejected and can be logged for follow-up. In this demo they are recorded locally in the browser.')}
<div class="stats"><div class="panel stat alert"><div class="kpi-label"><i class="kpi-dot"></i> Logged deviations</div><div class="kpi-value">${deviations.length}</div><div class="kpi-foot">Including demo validation failures</div></div><div class="panel stat positive"><div class="kpi-label"><i class="kpi-dot"></i> Direct ERP changes</div><div class="kpi-value">0</div><div class="kpi-foot">Read-only concept</div></div></div>
<section class="panel">${panelTitle('Deviation log','Attempts that could not be accepted due to workflow issues')}<div class="table-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Work order</th><th>Department</th><th>Issue</th><th>Outcome</th></tr></thead><tbody>${deviations.map(d=>`<tr><td>${escapeHtml(d.time)}</td><td class="weight">${escapeHtml(d.job)}</td><td>${escapeHtml(d.dept)}</td><td>${escapeHtml(d.issue)}</td><td><span class="tag red">Receipt prevented</span></td></tr>`).join('')||'<tr><td colspan="5">No deviations logged.</td></tr>'}</tbody></table></div></section><div class="note-box mt20">The demonstration cannot modify any production record. In a real implementation, incomplete work steps would need to be corrected in the existing production management system.</div>`}
function render(){const el=document.getElementById('content');let views={dashboard,receive:receiving,locations,workorders,exceptions};el.innerHTML=(views[page]||dashboard)();document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));document.getElementById('crumbName').textContent=({dashboard:'Overview',receive:'Receive item',locations:'Shelf locations',workorders:'Work orders',exceptions:'Process deviations'})[page];}
function navTo(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('on')}
let toastTimer;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function setDept(code){code=code.trim().toUpperCase();let d=DEPTS.find(x=>x.code===code);if(!d){toast('Unknown department. Try B-02 or A-03.');return}selectedDepartment=d.code;receiveStage=2;receiveResult=null;enteredTag='';render();document.getElementById('tagInput')?.focus()}
function scanTag(code){code=code.trim().toUpperCase();enteredTag=code;if(!selectedDepartment){toast('First identify the receiving department.');document.getElementById('deptInput')?.focus();return}if(!code){toast('Enter or select a work order / tool tag.');return}const j=jobs.find(x=>x.id.toUpperCase()===code);let reasons=[];if(!j)reasons.push('Unknown work order or asset identifier.');else {if(j.location)reasons.push('Item already registered in location '+j.location+'.');if(j.department!==selectedDepartment)reasons.push(`Wrong receiving department. Expected ${j.department} (${DEPTS.find(d=>d.code===j.department)?.name}).`);if(!j.check)reasons.push(...j.history);}
const loc=freeSpot(selectedDepartment);if(!loc)reasons.push('No free shelf location in this department.');receiveResult={job:j||null,loc,ok:reasons.length===0,confirmed:false,reasons};receiveStage=reasons.length?3:4;
if(reasons.length){deviations.unshift({time:time(),job:code,dept:selectedDepartment,issue:reasons.join(' · ')});events.unshift({time:time(),msg:`${code}: transfer blocked`,kind:'bad'})}render();}
function confirmReceipt(){const r=receiveResult;if(!r||!r.ok||r.confirmed)return;const j=jobs.find(x=>x.id===r.job.id);if(!j||j.location||occupied(r.loc)){toast('Location unavailable. Retry receipt.');return}j.location=r.loc;j.status='In storage';r.confirmed=true;events.unshift({time:time(),msg:`${j.id} stored in ${r.loc}`,kind:'ok'});render();toast('Receipt recorded in demo data.')}
function resetReceipt(){selectedDepartment='';enteredTag='';receiveResult=null;receiveStage=1;render()}
function openLoc(loc){const d=DEPTS.find(x=>loc.startsWith(x.code+'-'));if(d)locationFilter=d.code;locationFocus=loc;navTo('locations');document.getElementById('locationDetail')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.page){navTo(target.dataset.page);return}if(target.dataset.goto){navTo(target.dataset.goto);return}if(target.dataset.dept){setDept(target.dataset.dept);return}if(target.dataset.tag){enteredTag=target.dataset.tag;scanTag(target.dataset.tag);return}if(target.dataset.location){locationFocus=target.dataset.location;render();return}if(target.dataset.openloc){openLoc(target.dataset.openloc);return}
switch(target.id){case 'deptScan':setDept(document.getElementById('deptInput').value);break;case 'tagScan':scanTag(document.getElementById('tagInput').value);break;case 'clearReceive':case 'retryReceive':case 'nextReceive':resetReceipt();break;case 'confirmReceive':confirmReceipt();break;case 'resetBtn':initialize();render();toast('Sample data restored.');break;case 'menuBtn':document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('on');break;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='deptInput'){setDept(e.target.value)}if(e.key==='Enter'&&e.target.id==='tagInput'){scanTag(e.target.value)}});
document.addEventListener('change',e=>{if(e.target.id==='locationSelect'){locationFilter=e.target.value;locationFocus='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='jobsSearch'){jobsQuery=e.target.value;document.getElementById('jobRows').innerHTML=jobTable(jobs.filter(j=>[j.id,j.part,j.department,j.location,j.sn].some(v=>v.toLowerCase().includes(jobsQuery.toLowerCase()))));}});
document.getElementById('overlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('on')});
initialize();render();
</script>
</body>
</html>
